[package]
name = "markdown-desktop"
version = "1.1.2"
description = "A local-first cross-platform Markdown desktop reader and editor for documentation, notes, and AI-assisted workflows"
keywords = ["markdown", "editor", "viewer", "desktop", "mermaid"]
authors = ["Roy Dawson IV"]
license = "MIT"
edition = "2024"
rust-version = "1.99.1"
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markdown_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.7.3", features = [] }

[dependencies]
tauri = { version = "^2.12.4", features = [] }
tauri-plugin-opener = "^2.7.2"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
anyhow = "^1.0.104"
ammonia = "^4.2.3"
# The app uses Comrak as a parser/HTML formatter, not its CLI or syntect
# adapter. Keep the parser extensions used by the renderer while avoiding
# unused CLI/highlighting dependencies (including bincode and yaml-rust).
comrak = { version = "^0.56.0", default-features = false, features = ["attributes", "shortcodes"] }
encoding_rs = "^0.8.42"
ignore = "^0.4.33"
mime_guess = "^2.0.5"
notify = "^8.2.0"
reqwest = { version = "^0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "^0.40.2", features = ["bundled"] }
sha2 = "^0.11.1"
tempfile = "^3.27.0"
thiserror = "^2.0.21"
url = "^2.5.8"
walkdir = "^2.5.0"
tauri-plugin-dialog = "^2.8.3"
tauri-plugin-log = "^2.10.1"
tauri-plugin-process = "^2.4.0"
tauri-plugin-single-instance = "^2.5.4"
tauri-plugin-store = "^2.5.0"
tauri-plugin-updater = "^2.14.0"
tauri-plugin-window-state = "^2.5.0"
base64 = "^0.23.1"
uuid = { version = "^1.28.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "^0.61.2", features = ["Win32_Storage_FileSystem"] }
