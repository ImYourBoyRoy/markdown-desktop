[package]
name = "markdown-desktop"
version = "1.0.0"
description = "A desktop viewer and editor for Markdown files"
authors = ["Markdown Desktop Viewer-Editor contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.98.0"
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markdown_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
tauri = { version = "^2.11.5", features = [] }
tauri-plugin-opener = "^2.5.4"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
anyhow = "^1.0.104"
ammonia = "^4.1.4"
# The app uses Comrak as a parser/HTML formatter, not its CLI or syntect
# adapter. Keep the parser extensions used by the renderer while avoiding
# unused CLI/highlighting dependencies (including bincode and yaml-rust).
comrak = { version = "^0.54.0", default-features = false, features = ["attributes", "shortcodes"] }
encoding_rs = "^0.8.35"
ignore = "^0.4.33"
mime_guess = "^2.0.5"
notify = "^8.2.0"
reqwest = { version = "^0.13.4", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "^0.40.2", features = ["bundled"] }
sha2 = "^0.11.0"
tempfile = "^3.27.0"
thiserror = "^2.0.20"
url = "^2.5.8"
walkdir = "^2.5.0"
tauri-plugin-dialog = "^2.7.2"
tauri-plugin-log = "^2.9.0"
tauri-plugin-process = "^2.3.1"
tauri-plugin-single-instance = "^2.4.3"
tauri-plugin-store = "^2.4.4"
tauri-plugin-updater = "^2.10.1"
tauri-plugin-window-state = "^2.4.1"
base64 = "^0.23.1"
