name: Release Markdown Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.21.0'

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      # Every matrix entry uploads to the same draft release and merges the
      # same latest.json. Keep those GitHub release mutations deterministic.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: ''
            args: ''
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - name: Linux x64
            os: ubuntu-22.04
            target: ''
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release tag and signing secret
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const version=JSON.parse(fs.readFileSync('package.json','utf8')).version; if (process.env.RELEASE_TAG.startsWith('v') && process.env.RELEASE_TAG !== 'v' + version) { console.error('Release tag must match package.json version: expected v' + version + ', got ' + process.env.RELEASE_TAG); process.exit(1); } if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) { console.error('TAURI_SIGNING_PRIVATE_KEY is required for signed release artifacts.'); process.exit(1); }"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install requested Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and stage portable/installable layout
        run: pnpm build:app ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Upload staged platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: markdown-desktop-${{ matrix.target || runner.os }}-${{ runner.arch }}
          path: Apps/**
          if-no-files-found: error

      - name: Verify staged platform artifacts
        run: pnpm smoke:native ${{ matrix.args }}

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: Markdown Desktop Viewer-Editor v__VERSION__
          releaseBody: |
            Download the installer for your operating system from the assets below. Windows also includes a portable executable. GitHub provides Source code archives for this tag below the release assets.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          releaseAssetNamePattern: 'markdown-desktop-[version]-[platform]-[arch][setup][ext]'

      - name: Upload Windows portable executable
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: '--no-bundle'
          tagName: v__VERSION__
          releaseName: Markdown Desktop Viewer-Editor v__VERSION__
          releaseBody: |
            Download the installer for your operating system from the assets below. Windows also includes a portable executable. GitHub provides Source code archives for this tag below the release assets.
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: 'markdown-desktop-[version]-[platform]-[arch][setup][ext]'

  publish:
    name: Publish and verify release
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify published assets and source archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets,tarballUrl,zipballUrl > release.json
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          echo "LATEST_TAG=${latest_tag}" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const release = JSON.parse(readFileSync('release.json', 'utf8'));
          const names = release.assets.map((asset) => asset.name);
          const has = (predicate) => names.some(predicate);
          const failures = [];

          if (release.isDraft) failures.push('release is still a draft');
          if (process.env.LATEST_TAG !== process.env.RELEASE_TAG) failures.push(`release is not marked latest: ${process.env.LATEST_TAG ?? 'unknown'}`);
          if (!release.tarballUrl || !release.zipballUrl) failures.push('GitHub source archives are missing');
          if (!has((name) => /-setup\.exe$/i.test(name))) failures.push('Windows NSIS installer is missing');
          if (!has((name) => /\.msi$/i.test(name))) failures.push('Windows MSI installer is missing');
          if (!has((name) => /windows/i.test(name) && /\.exe$/i.test(name) && !/-setup\.exe$/i.test(name))) failures.push('Windows portable executable is missing');
          if (names.filter((name) => /\.dmg$/i.test(name)).length < 2) failures.push('macOS Intel and Apple Silicon DMGs are missing');
          if (!has((name) => /\.AppImage$/i.test(name))) failures.push('Linux AppImage is missing');
          if (!has((name) => /\.deb$/i.test(name))) failures.push('Linux DEB package is missing');
          if (!has((name) => /\.rpm$/i.test(name))) failures.push('Linux RPM package is missing');
          if (!has((name) => /\.sig$/i.test(name))) failures.push('signed updater assets are missing');
          if (!has((name) => name === 'latest.json')) failures.push('latest.json updater metadata is missing');

          console.log(JSON.stringify({ tag: process.env.RELEASE_TAG, assets: names, sourceArchives: { tarball: release.tarballUrl, zipball: release.zipballUrl } }, null, 2));
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE
