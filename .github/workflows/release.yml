name: Release Markdown Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify an existing versioned release without rebuilding artifacts
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.21.0'

jobs:
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      # Every matrix entry uploads to the same draft release and merges the
      # same latest.json. Keep those GitHub release mutations deterministic.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: ''
            args: ''
            asset_pattern: 'Markdown-Desktop-[version]-Windows-x64[setup][ext]'
          - name: Windows ARM64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            args: '--target aarch64-pc-windows-msvc'
            asset_pattern: 'Markdown-Desktop-[version]-Windows-ARM64[setup][ext]'
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            asset_pattern: 'Markdown-Desktop-[version]-macOS-Apple-Silicon[ext]'
          - name: macOS Intel
            os: macos-26-intel
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            asset_pattern: 'Markdown-Desktop-[version]-macOS-Intel[ext]'
          - name: Linux x64
            os: ubuntu-22.04
            target: ''
            args: ''
            asset_pattern: 'Markdown-Desktop-[version]-Linux-x64[ext]'
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: '--target aarch64-unknown-linux-gnu'
            asset_pattern: 'Markdown-Desktop-[version]-Linux-ARM64[ext]'
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release tag and signing secret
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const version=JSON.parse(fs.readFileSync('package.json','utf8')).version; if (process.env.RELEASE_TAG.startsWith('v') && process.env.RELEASE_TAG !== 'v' + version) { console.error('Release tag must match package.json version: expected v' + version + ', got ' + process.env.RELEASE_TAG); process.exit(1); } if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) { console.error('TAURI_SIGNING_PRIVATE_KEY is required for signed release artifacts.'); process.exit(1); }"

      - name: Verify macOS signing and notarization secrets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required for signed and notarized macOS artifacts."
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Install requested Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and stage portable/installable layout
        run: pnpm build:app ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Upload staged platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: markdown-desktop-${{ matrix.target || runner.os }}-${{ runner.arch }}
          path: Apps/**
          if-no-files-found: error

      - name: Verify staged platform artifacts
        run: pnpm smoke:native ${{ matrix.args }}

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: Markdown Desktop v__VERSION__
          releaseBody: |
            ## Download Markdown Desktop

            Choose the package for your operating system:

            - **Windows x64:** `Markdown-Desktop-<version>-Windows-x64-setup.exe` is the recommended installer. Use `...-Windows-x64.msi` for managed Windows Installer deployments or `...-Windows-x64-Portable.exe` without installation.
            - **Windows ARM64:** `Markdown-Desktop-<version>-Windows-ARM64-setup.exe` is the native ARM installer. The NSIS installer itself uses Windows compatibility support where needed.
            - **macOS Apple Silicon:** `...-macOS-Apple-Silicon.dmg`
            - **macOS Intel:** `...-macOS-Intel.dmg`
            - **Linux x64:** `...-Linux-x64.AppImage` is the portable option; `.deb` is for Debian/Ubuntu-based systems and `.rpm` is for Fedora/openSUSE-based systems.
            - **Linux ARM64:** `...-Linux-ARM64.AppImage` is the portable option; `.deb` and `.rpm` are also provided.

            Files ending in `.sig` and `latest.json` support signed in-app updates and normally do not need to be downloaded manually. GitHub provides the `Source code` archives for the tagged source tree below the release assets.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: ${{ matrix.asset_pattern }}

      - name: Verify macOS signature, Gatekeeper assessment, and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          search_root="src-tauri/target"
          if [[ -n "${{ matrix.target }}" ]]; then
            search_root="src-tauri/target/${{ matrix.target }}"
          fi
          app_path="$(find "$search_root" -type d -name '*.app' -path '*/bundle/macos/*' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo 'No macOS .app bundle was found for signature verification.'
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Upload Windows portable executable
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version
          $releaseTag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" }
          $target = '${{ matrix.target }}'
          $releaseRoot = if ([string]::IsNullOrWhiteSpace($target)) {
            Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release'
          } else {
            Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/$target/release"
          }
          $binary = Join-Path $releaseRoot 'markdown-desktop.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Release binary was not built: $binary"
          }
          $architecture = if ($target -eq 'aarch64-pc-windows-msvc') { 'ARM64' } else { 'x64' }
          $assetName = "Markdown-Desktop-$version-Windows-$architecture-Portable.exe"
          $staged = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item -LiteralPath $binary -Destination $staged -Force
          gh release upload $releaseTag $staged --repo $env:GITHUB_REPOSITORY --clobber

  publish:
    name: Publish and verify release
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.verify_only)) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Fetch release metadata for verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets,tarballUrl,zipballUrl > release.json
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --pattern latest.json --dir release-assets --clobber

      - name: Verify release assets before publication
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const release = JSON.parse(readFileSync('release.json', 'utf8'));
          const names = release.assets.map((asset) => asset.name);
          const latest = JSON.parse(readFileSync('release-assets/latest.json', 'utf8'));
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const expectedDownloadPrefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/`;
          const expected = {
            windowsSetup: `Markdown-Desktop-${version}-Windows-x64-setup.exe`,
            windowsMsi: `Markdown-Desktop-${version}-Windows-x64.msi`,
            windowsPortable: `Markdown-Desktop-${version}-Windows-x64-Portable.exe`,
            windowsArmSetup: `Markdown-Desktop-${version}-Windows-ARM64-setup.exe`,
            windowsArmMsi: `Markdown-Desktop-${version}-Windows-ARM64.msi`,
            windowsArmPortable: `Markdown-Desktop-${version}-Windows-ARM64-Portable.exe`,
            macAppleDmg: `Markdown-Desktop-${version}-macOS-Apple-Silicon.dmg`,
            macIntelDmg: `Markdown-Desktop-${version}-macOS-Intel.dmg`,
            macAppleArchive: `Markdown-Desktop-${version}-macOS-Apple-Silicon.app.tar.gz`,
            macIntelArchive: `Markdown-Desktop-${version}-macOS-Intel.app.tar.gz`,
            linuxAppImage: `Markdown-Desktop-${version}-Linux-x64.AppImage`,
            linuxDeb: `Markdown-Desktop-${version}-Linux-x64.deb`,
            linuxRpm: `Markdown-Desktop-${version}-Linux-x64.rpm`,
            linuxArmAppImage: `Markdown-Desktop-${version}-Linux-ARM64.AppImage`,
            linuxArmDeb: `Markdown-Desktop-${version}-Linux-ARM64.deb`,
            linuxArmRpm: `Markdown-Desktop-${version}-Linux-ARM64.rpm`,
          };
          const has = (predicate) => names.some(predicate);
          const failures = [];

          if (!release.tarballUrl || !release.zipballUrl) failures.push('GitHub source archives are missing');
          for (const [label, name] of Object.entries(expected)) {
            if (!names.includes(name)) failures.push(`${label} is missing: ${name}`);
          }
          for (const name of [expected.windowsSetup, expected.windowsMsi, expected.windowsArmSetup, expected.windowsArmMsi, expected.macAppleArchive, expected.macIntelArchive, expected.linuxAppImage, expected.linuxDeb, expected.linuxRpm, expected.linuxArmAppImage, expected.linuxArmDeb, expected.linuxArmRpm]) {
            if (!names.includes(`${name}.sig`)) failures.push(`signed companion is missing: ${name}.sig`);
          }
          if (!has((name) => name === 'latest.json')) failures.push('latest.json updater metadata is missing');
          if (String(latest.version ?? '').replace(/^v/, '') !== version) failures.push(`latest.json version does not match release: ${latest.version ?? 'missing'}`);

          const updaterPlatforms = Object.entries(latest.platforms ?? {});
          if (updaterPlatforms.length === 0) failures.push('latest.json contains no updater platforms');
          for (const [platform, data] of updaterPlatforms) {
            if (!data?.signature || !data?.url) {
              failures.push(`latest.json platform is incomplete: ${platform}`);
              continue;
            }
            if (!data.url.startsWith(expectedDownloadPrefix)) failures.push(`latest.json platform uses a non-canonical release URL: ${platform} -> ${data.url}`);
            const assetName = decodeURIComponent(new URL(data.url).pathname.split('/').pop() ?? '');
            if (!names.includes(assetName)) failures.push(`latest.json URL does not point to a release asset: ${platform} -> ${assetName}`);
            if (!names.includes(`${assetName}.sig`)) failures.push(`latest.json asset has no signed companion: ${assetName}.sig`);
          }
          const expectedUpdaterAssets = {
            'windows-x86_64': expected.windowsSetup,
            'windows-aarch64': expected.windowsArmSetup,
            'darwin-aarch64': expected.macAppleArchive,
            'darwin-x86_64': expected.macIntelArchive,
            'linux-x86_64': expected.linuxAppImage,
            'linux-aarch64': expected.linuxArmAppImage,
          };
          for (const [platform, expectedAsset] of Object.entries(expectedUpdaterAssets)) {
            const data = latest.platforms?.[platform];
            if (!data) {
              failures.push(`latest.json is missing required updater platform: ${platform}`);
              continue;
            }
            if (!data.url) {
              failures.push(`latest.json required updater platform has no URL: ${platform}`);
              continue;
            }
            const assetName = decodeURIComponent(new URL(data.url).pathname.split('/').pop() ?? '');
            if (assetName !== expectedAsset) failures.push(`latest.json platform points to the wrong asset: ${platform} -> ${assetName}; expected ${expectedAsset}`);
          }

          console.log(JSON.stringify({ tag: process.env.RELEASE_TAG, assets: names, updaterPlatforms: Object.fromEntries(updaterPlatforms.map(([platform, data]) => [platform, data.url])), sourceArchives: { tarball: release.tarballUrl, zipball: release.zipballUrl } }, null, 2));
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Publish release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft > release-published.json
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          export LATEST_TAG="$latest_tag"
          node -e "const fs=require('node:fs'); const release=JSON.parse(fs.readFileSync('release-published.json','utf8')); const latest=process.env.LATEST_TAG; if (release.isDraft) { console.error('release is still a draft'); process.exit(1); } if (latest !== process.env.RELEASE_TAG) { console.error('release is not marked latest: ' + (latest || 'unknown')); process.exit(1); }"
